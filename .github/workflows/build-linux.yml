name: Build Linux Executable

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux GUI dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install runtime and build dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Build native Linux executable
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Linux package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: contexta-linux
          path: dist/contexta-linux.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/contexta-linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
