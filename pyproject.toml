[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexta-ai"
version = "2.0.0"
description = "AI-native codebase context engine. Scans projects and serves intelligent context packs to Claude Code, Cursor, Windsurf, and any MCP-compatible tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pablo Kaua", email = "help@spacegroupusa.com" }]
keywords = ["ai", "context", "mcp", "claude", "cursor", "codebase", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pathspec>=0.12,<1.1",
    "charset-normalizer>=3.4,<4",
    "tiktoken>=0.12,<1",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.6,<2",
    "rapidfuzz>=3.14,<4",
    "mcp[cli]>=1.9,<2",
]

[project.optional-dependencies]
claude = ["anthropic>=0.52,<1"]
gemini = ["google-genai>=1.14,<2"]
openai = ["openai>=1.82,<2"]
all-ai = ["anthropic>=0.52,<1", "google-genai>=1.14,<2", "openai>=1.82,<2"]
gui = []

[project.scripts]
contexta = "contexta:main"

[project.urls]
Homepage = "https://github.com/pablokaua03/contexta"
Repository = "https://github.com/pablokaua03/contexta"

[tool.hatch.build.targets.wheel]
packages = ["contexta_app"]
include = ["contexta.py", "contexta_mcp.py"]
